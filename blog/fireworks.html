<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>熊出没 · 双曲烟花盛典 · 史诗级</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #02060c;
            overflow: hidden;
            height: 100vh;
            font-family: 'Segoe UI', 'PingFang SC', system-ui, sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at bottom, #0a1a2a, #020408);
            cursor: default;
        }
        #overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(2, 6, 12, 0.85);
            backdrop-filter: blur(8px);
            transition: opacity 1s ease;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #overlay h1 {
            font-size: clamp(32px, 6vw, 72px);
            font-weight: 800;
            background: linear-gradient(135deg, #f9d976, #f39c12, #f9d976);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s ease-in-out infinite alternate;
            letter-spacing: 4px;
            margin-bottom: 8px;
            text-shadow: 0 0 60px rgba(243, 156, 18, 0.2);
        }
        #overlay .sub {
            color: rgba(255, 255, 255, 0.5);
            font-size: clamp(14px, 1.4vw, 22px);
            letter-spacing: 8px;
            font-weight: 300;
            margin-bottom: 32px;
        }
        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }
        .btn-start {
            padding: 16px 56px;
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            background: linear-gradient(135deg, #f7d875, #f39c12);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 8px 40px rgba(243, 156, 18, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }
        .btn-start:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 56px rgba(243, 156, 18, 0.6);
        }
        .btn-start:active {
            transform: scale(0.96);
        }
        .btn-start .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ef4444;
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 20px;
            letter-spacing: 0;
        }
        #loadStatus {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-top: 20px;
            letter-spacing: 1px;
            min-height: 24px;
        }
        .progress-bar {
            width: 280px;
            max-width: 70vw;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f7d875, #f39c12);
            border-radius: 4px;
            transition: width 0.3s;
        }
        #controls {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        #controls.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #controls button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.2s, transform 0.2s;
            border-radius: 8px;
        }
        #controls button:hover {
            color: #fff;
            transform: scale(1.1);
        }
        #controls .time {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 1px;
            min-width: 80px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }
        #controls .song-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 300;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 600px) {
            #overlay h1 {
                font-size: 28px;
            }
            #overlay .sub {
                font-size: 12px;
                letter-spacing: 4px;
            }
            .btn-start {
                padding: 12px 32px;
                font-size: 17px;
            }
            #controls {
                padding: 8px 14px;
                gap: 12px;
                bottom: 16px;
            }
            #controls .song-label {
                max-width: 60px;
                font-size: 10px;
            }
            #controls .time {
                font-size: 11px;
                min-width: 60px;
            }
        }
    </style>
</head>
<body>
    <canvas id="mainCanvas"></canvas>
    <div id="overlay">
        <h1>✨ 熊出没 · 双曲盛典</h1>
        <div class="sub">— 史诗级 · 万焰齐发 —</div>
        <button class="btn-start" id="btnStart">
            🎆 开启焰火
            <span class="badge">5min</span>
        </button>
        <div id="loadStatus">⏳ 加载音乐中...</div>
        <div class="progress-bar"><div class="fill" id="loadFill"></div></div>
    </div>
    <div id="controls">
        <button id="btnPlayPause" title="播放/暂停">⏸</button>
        <span class="song-label" id="songLabel">我乘着风飞过来</span>
        <span class="time" id="timeDisplay">00:00 / 07:35</span>
        <button id="btnReset" title="重头开始">⟳</button>
    </div>
    <script>
        // ============================================================
        //  熊出没 · 双曲烟花盛典 · 史诗级
        //  5种烟花造型 · 密集阵列 · 节拍灯光 · 真实城市 · 强反差
        // ============================================================
        (function() {
            'use strict';

            const canvas = document.getElementById('mainCanvas');
            const ctx = canvas.getContext('2d');
            const overlay = document.getElementById('overlay');
            const btnStart = document.getElementById('btnStart');
            const loadStatus = document.getElementById('loadStatus');
            const loadFill = document.getElementById('loadFill');
            const controls = document.getElementById('controls');
            const btnPlayPause = document.getElementById('btnPlayPause');
            const btnReset = document.getElementById('btnReset');
            const timeDisplay = document.getElementById('timeDisplay');
            const songLabel = document.getElementById('songLabel');

            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const rand = (a, b) => Math.random() * (b - a) + a;
            const randInt = (a, b) => Math.floor(rand(a, b + 1));
            const lerp = (a, b, t) => a + (b - a) * t;
            const clamp = (v, mn, mx) => Math.max(mn, Math.min(mx, v));

            function hsl(h, s, l) { return `hsl(${h%360}, ${s||90}%, ${l||60}%)`; }

            function hexToRgb(hex) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return [r, g, b];
            }

            const SONGS = [{
                id: 'song1',
                name: '我乘着风飞过来',
                url: 'https://github.com/jgcgzs/acns/blob/72728fbe32a05c58137eb8db332a767b26b90ce1/%E6%B4%AA%E8%BE%B0%E3%80%81%E5%AE%81%E6%A1%93%E5%AE%87%20-%20%E6%88%91%E4%B9%98%E7%9D%80%E9%A3%8E%E9%A3%9E%E8%BF%87%E6%9D%A5.mp3?raw=true',
                duration: 232,
                startOffset: 0,
                scene: 'grassland'
            }, {
                id: 'song2',
                name: '鹿 be free',
                url: 'https://github.com/jgcgzs/acns/blob/72728fbe32a05c58137eb8db332a767b26b90ce1/%E5%B0%9A%E9%9B%AF%E5%A9%95%20-%20%E9%B9%BF%20be%20free.mp3?raw=true',
                duration: 223,
                startOffset: 232,
                scene: 'forest'
            }];
            const TOTAL_DURATION = 232 + 223 + 5;

            let audio1 = null,
                audio2 = null;
            let isAudioLoaded = false;
            let isPlaying = false,
                isPaused = false;
            let songIndex = 0,
                elapsedTime = 0,
                globalTime = 0;
            let lastTimestamp = 0,
                startTime = 0;
            let animFrameId = null;

            // ---- 粒子系统 ----
            let particles = [];
            let rockets = [];
            let stars = [];
            const MAX_PARTICLES = 5000;
            const MAX_ROCKETS = 300;
            let currentScene = 'grassland';
            let sceneTransition = 0;
            let currentBg = { top: '#0a1a2a', bottom: '#0a2a1a', ground: '#0a1a0a' };
            let targetBg = { top: '#0a1a2a', bottom: '#0a2a1a', ground: '#0a1a0a' };
            let lightingMode = 'off',
                lightingTimer = 0;
            let schedule = [];
            let executedEvents = new Set();

            // ---- 节拍系统 (120BPM) ----
            const BPM = 120;
            const BEAT_INTERVAL = 60 / BPM;
            let beatCounter = 0;
            let lastBeatTime = 0;

            // ---- 重力 ----
            const GRAVITY = 0.22;

            // ============================================================
            //  1. 粒子（爆炸碎片）
            // ============================================================
            class Particle {
                constructor(opts) {
                    this.x = opts.x || 0;
                    this.y = opts.y || 0;
                    this.color = opts.color || '#ffcc44';
                    this.size = opts.size || rand(1.5, 4);
                    this.vx = opts.vx || rand(-4, 4);
                    this.vy = opts.vy || rand(-5, 1);
                    this.life = opts.life || rand(30, 70);
                    this.maxLife = this.life;
                    this.gravity = opts.gravity || 0.045;
                    this.fade = opts.fade !== undefined ? opts.fade : true;
                    this.alpha = 1;
                    this.trail = [];
                    this.trailLen = opts.trailLen || randInt(2, 4);
                    this.glow = opts.glow !== undefined ? opts.glow : false;
                    this.sizeDecay = opts.sizeDecay || 0.995;
                    this.type = opts.type || 'spark';
                    this.rotation = opts.rotation || 0;
                    this.rotSpeed = opts.rotSpeed || 0;
                }
                update() {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > this.trailLen) this.trail.shift();
                    this.vx *= 0.98;
                    this.vy *= 0.98;
                    this.vy += this.gravity;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life--;
                    if (this.fade) this.alpha = this.life / this.maxLife;
                    this.size *= this.sizeDecay;
                    if (this.rotSpeed) this.rotation += this.rotSpeed;
                }
                draw(ctx) {
                    if (this.alpha < 0.01 || this.size < 0.1) return;
                    for (let i = 1; i < this.trail.length; i++) {
                        const t = i / this.trail.length;
                        const ta = this.alpha * t * 0.3;
                        const r = this.size * t * 0.3;
                        ctx.globalAlpha = ta;
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.trail[i].x, this.trail[i].y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = this.alpha;
                    if (this.type === 'glow') {
                        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                        grad.addColorStop(0, '#ffffff');
                        grad.addColorStop(0.2, this.color);
                        grad.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, Math.max(this.size, 0.2), 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (this.glow && this.size > 2 && this.alpha > 0.3 && this.type !== 'glow') {
                        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
                        grad.addColorStop(0, this.color);
                        grad.addColorStop(1, 'rgba(255,255,255,0)');
                        ctx.globalAlpha = this.alpha * 0.15;
                        ctx.fillStyle = grad;
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
                isDead() { return this.life <= 0 || this.size < 0.1 || this.alpha <= 0.01; }
            }

            // ============================================================
            //  2. 火箭（含多种爆炸造型）
            // ============================================================
            class Rocket {
                constructor(opts) {
                    this.x = opts.x || W * 0.5;
                    this.y = opts.y || H;
                    const tx = opts.targetX || this.x + rand(-20, 20);
                    const ty = opts.targetY || rand(H * 0.05, H * 0.4);
                    this.color = opts.color || hsl(rand(0, 360), 90, 65);
                    this.size = opts.size || rand(2, 4.5);
                    this.isArray = opts.isArray || false;
                    this.theme = opts.theme || 'warm';
                    this.hueBase = opts.hueBase || rand(0, 360);
                    this.burstCount = opts.burstCount || 0;
                    this.subBursts = opts.subBursts || 0;
                    this.shape = opts.shape || 'normal'; // normal, ring, chrysanthemum, peony, meteor

                    const dx = tx - this.x;
                    const dy = this.y - ty;
                    const vy0 = Math.sqrt(2 * GRAVITY * Math.max(dy, 10));
                    const tFlight = vy0 / GRAVITY;
                    const vx0 = dx / tFlight;
                    this.vx = vx0 * rand(0.85, 1.15) + rand(-0.4, 0.4);
                    this.vy = -vy0 * rand(0.90, 1.10);
                    this.startX = this.x;
                    this.startY = this.y;
                    this.targetY = ty;
                    this.reachedApex = false;
                    this.fadeTimer = 0;
                    this.fading = false;
                    this.alive = true;
                    this.trail = [];
                    this.trailLen = 14;
                    this.sparkle = opts.sparkle || false;
                }

                update() {
                    if (this.fading) {
                        this.fadeTimer++;
                        this.size *= 0.97;
                        if (this.fadeTimer > 20 || this.size < 0.3) {
                            this.alive = false;
                        }
                        this.trail.push({ x: this.x, y: this.y });
                        if (this.trail.length > this.trailLen) this.trail.shift();
                        return;
                    }

                    this.vx *= 0.995;
                    this.vy += GRAVITY;
                    this.x += this.vx;
                    this.y += this.vy;

                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > this.trailLen) this.trail.shift();

                    if (!this.reachedApex && this.vy > 0) {
                        this.reachedApex = true;
                        if (this.isArray) {
                            this.fading = true;
                            this.fadeTimer = 0;
                            // 加一点微光
                            for (let i = 0; i < 3; i++) {
                                const p = new Particle({
                                    x: this.x + rand(-8, 8),
                                    y: this.y + rand(-4, 4),
                                    color: this.color,
                                    size: rand(0.8, 2),
                                    vx: rand(-0.5, 0.5),
                                    vy: rand(-0.5, 0.5),
                                    life: randInt(8, 18),
                                    gravity: 0.01,
                                    trailLen: 1,
                                    glow: false,
                                    type: 'spark'
                                });
                                particles.push(p);
                            }
                        } else {
                            this.alive = false;
                            this.explode();
                        }
                    }
                    if (this.y > H + 50) this.alive = false;
                }

                explode() {
                    const hue = this.hueBase;
                    const theme = this.theme;
                    const shape = this.shape || 'normal';
                    let palette = [];
                    if (theme === 'warm') palette = [0, 20, 40, 60];
                    else if (theme === 'cool') palette = [180, 210, 240, 270];
                    else if (theme === 'gold') palette = [35, 45, 50, 55];
                    else if (theme === 'purple') palette = [270, 290, 310, 330];
                    else if (theme === 'fire') palette = [0, 10, 20, 30];
                    else if (theme === 'ice') palette = [190, 210, 230, 250];
                    else if (theme === 'rainbow') palette = [0, 60, 120, 180, 240, 300];
                    else if (theme === 'forest') palette = [90, 120, 150, 180];
                    else if (theme === 'white') palette = [0];
                    else palette = [0, 60, 120, 180, 240, 300];
                    const colors = [];
                    for (let i = 0; i < Math.min(palette.length, 6); i++) {
                        const dh = palette[i % palette.length] + rand(-15, 15);
                        colors.push(hsl(hue + dh, rand(80, 100), rand(50, 75)));
                    }
                    const baseCount = this.burstCount || randInt(100, 180);

                    // ----- 根据造型决定粒子分布 -----
                    if (shape === 'ring') {
                        // 环形
                        const ringCount = Math.floor(baseCount * 0.8);
                        for (let i = 0; i < ringCount; i++) {
                            const ang = rand(0, Math.PI * 2);
                            const sp = rand(3, 6);
                            const vx = Math.cos(ang) * sp * rand(0.9, 1.1);
                            const vy = Math.sin(ang) * sp * rand(0.9, 1.1) - rand(0, 0.5);
                            const sz = rand(1.8, 4);
                            const life = randInt(50, 90);
                            const col = colors[randInt(0, colors.length - 1)];
                            const p = new Particle({
                                x: this.x,
                                y: this.y,
                                color: col,
                                size: sz,
                                vx: vx,
                                vy: vy,
                                life: life,
                                gravity: 0.035,
                                trailLen: randInt(3, 6),
                                glow: true,
                                sizeDecay: 0.997
                            });
                            particles.push(p);
                        }
                        // 中心填充
                        for (let i = 0; i < baseCount * 0.3; i++) {
                            const ang = rand(0, Math.PI * 2);
                            const sp = rand(0.5, 3);
                            const vx = Math.cos(ang) * sp;
                            const vy = Math.sin(ang) * sp - rand(0, 1);
                            const sz = rand(1, 2.5);
                            const life = randInt(30, 60);
                            const col = colors[randInt(0, colors.length - 1)];
                            const p = new Particle({
                                x: this.x,
                                y: this.y,
                                color: col,
                                size: sz,
                                vx: vx,
                                vy: vy,
                                life: life,
                                gravity: 0.02,
                                trailLen: 2,
                                glow: false,
                                sizeDecay: 0.995
                            });
                            particles.push(p);
                        }
                    } else if (shape === 'chrysanthemum') {
                        // 菊花：密集放射
                        for (let i = 0; i < baseCount * 1.2; i++) {
                            const ang = rand(0, Math.PI * 2);
                            const sp = rand(2, 7);
                            const vx = Math.cos(ang) * sp * rand(0.8, 1.2);
                            const vy = Math.sin(ang) * sp * rand(0.8, 1.2) - rand(0, 0.8);
                            const sz = rand(1.2, 3.5);
                            const life = randInt(40, 80);
                            const col = colors[randInt(0, colors.length - 1)];
                            const p = new Particle({
                                x: this.x,
                                y: this.y,
                                color: col,
                                size: sz,
                                vx: vx,
                                vy: vy,
                                life: life,
                                gravity: 0.04,
                                trailLen: randInt(4, 8),
                                glow: true,
                                sizeDecay: 0.996
                            });
                            particles.push(p);
                        }
                    } else if (shape === 'peony') {
                        // 牡丹：大而饱满
                        const layers = 3;
                        for (let layer = 0; layer < layers; layer++) {
                            const layerCount = Math.floor(baseCount * 0.6 / (layers - layer * 0.2));
                            const spBase = 2 + layer * 1.5;
                            for (let i = 0; i < layerCount; i++) {
                                const ang = rand(0, Math.PI * 2);
                                const sp = spBase * rand(0.8, 1.3);
                                const vx = Math.cos(ang) * sp;
                                const vy = Math.sin(ang) * sp - rand(0, 1);
                                const sz = rand(1.5, 4.5) * (1 + layer * 0.15);
                                const life = randInt(50, 100) + layer * 10;
                                const col = colors[randInt(0, colors.length - 1)];
                                const p = new Particle({
                                    x: this.x + rand(-3, 3),
                                    y: this.y + rand(-3, 3),
                                    color: col,
                                    size: sz,
                                    vx: vx,
                                    vy: vy,
                                    life: life,
                                    gravity: 0.04 - layer * 0.005,
                                    trailLen: randInt(3, 6),
                                    glow: true,
                                    sizeDecay: 0.997
                                });
                                particles.push(p);
                            }
                        }
                        // 核心白芒
                        for (let i = 0; i < 20; i++) {
                            const ang = rand(0, Math.PI * 2);
                            const sp = rand(1, 3);
                            const vx = Math.cos(ang) * sp;
                            const vy = Math.sin(ang) * sp - rand(0, 1);
                            const p = new Particle({
                                x: this.x,
                                y: this.y,
                                color: '#ffffff',
                                size: rand(1, 2.5),
                                vx: vx,
                                vy: vy,
                                life: randInt(20, 40),
                                gravity: 0.01,
                                trailLen: 2,
                                glow: false,
                                type: 'glow'
                            });
                            particles.push(p);
                        }
                    } else if (shape === 'meteor') {
                        // 流星：长拖尾，方向集中
                        const dir = rand(0, Math.PI * 2);
                        for (let i = 0; i < baseCount * 0.5; i++) {
                            const ang = dir + rand(-0.4, 0.4);
                            const sp = rand(3, 9);
                            const vx = Math.cos(ang) * sp;
                            const vy = Math.sin(ang) * sp - rand(0, 1);
                            const sz = rand(1.2, 3);
                            const life = randInt(30, 60);
                            const col = colors[randInt(0, colors.length - 1)];
                            const p = new Particle({
                                x: this.x,
                                y: this.y,
                                color: col,
                                size: sz,
                                vx: vx,
                                vy: vy,
                                life: life,
                                gravity: 0.02,
                                trailLen: randInt(6, 12),
                                glow: false,
                                sizeDecay: 0.99
                            });
                            particles.push(p);
                        }
                    } else {
                        // normal: 均匀爆炸
                        for (let i = 0; i < baseCount; i++) {
                            const ang = rand(0, Math.PI * 2);
                            const sp = rand(2, 7);
                            const vx = Math.cos(ang) * sp * rand(0.7, 1.3);
                            const vy = Math.sin(ang) * sp * rand(0.7, 1.3) - rand(0, 1.5);
                            const sz = rand(1.5, 4);
                            const life = randInt(40, 90);
                            const col = colors[randInt(0, colors.length - 1)];
                            const p = new Particle({
                                x: this.x,
                                y: this.y,
                                color: col,
                                size: sz,
                                vx: vx,
                                vy: vy,
                                life: life,
                                gravity: 0.04,
                                trailLen: randInt(3, 6),
                                glow: true,
                                sizeDecay: 0.997
                            });
                            particles.push(p);
                        }
                    }

                    // 子母弹
                    const subCount = this.subBursts || randInt(1, 2);
                    for (let sub = 0; sub < subCount; sub++) {
                        const ang = rand(0, Math.PI * 2);
                        const dist = rand(10, 35);
                        const sx = this.x + Math.cos(ang) * dist;
                        const sy = this.y + Math.sin(ang) * dist - 5;
                        const sc = randInt(30, 60);
                        const scolor = colors[randInt(0, colors.length - 1)];
                        for (let i = 0; i < sc; i++) {
                            const ang2 = rand(0, Math.PI * 2);
                            const sp2 = rand(1, 4.5);
                            const vx2 = Math.cos(ang2) * sp2 * rand(0.6, 1.2);
                            const vy2 = Math.sin(ang2) * sp2 * rand(0.6, 1.2) - rand(0, 1);
                            const sz2 = rand(1, 2.8);
                            const life2 = randInt(30, 70);
                            const p2 = new Particle({
                                x: sx,
                                y: sy,
                                color: scolor,
                                size: sz2,
                                vx: vx2,
                                vy: vy2,
                                life: life2,
                                gravity: 0.03,
                                trailLen: randInt(2, 4),
                                glow: false,
                                sizeDecay: 0.996
                            });
                            particles.push(p2);
                        }
                    }
                    // 星芒
                    for (let i = 0; i < 15; i++) {
                        const ang = rand(0, Math.PI * 2);
                        const sp = rand(6, 14);
                        const vx = Math.cos(ang) * sp;
                        const vy = Math.sin(ang) * sp - rand(0, 2);
                        const p = new Particle({
                            x: this.x,
                            y: this.y,
                            color: '#ffffff',
                            size: rand(0.8, 2),
                            vx: vx,
                            vy: vy,
                            life: randInt(10, 25),
                            gravity: 0.01,
                            trailLen: 2,
                            glow: false,
                            type: 'glow'
                        });
                        particles.push(p);
                    }
                }

                draw(ctx) {
                    for (let i = 0; i < this.trail.length; i++) {
                        const t = i / this.trail.length;
                        let a = t * 0.7;
                        if (this.fading) a *= (1 - this.fadeTimer / 20);
                        const r = this.size * (0.2 + t * 0.5);
                        ctx.globalAlpha = Math.max(a, 0);
                        ctx.fillStyle = this.color;
                        ctx.beginPath();
                        ctx.arc(this.trail[i].x, this.trail[i].y, r, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    if (this.fading && this.fadeTimer > 15) {
                        ctx.globalAlpha = 1;
                        return;
                    }
                    ctx.globalAlpha = 1;
                    ctx.shadowColor = this.color;
                    ctx.shadowBlur = 25;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    const grad = ctx.createRadialGradient(this.x - this.size * 0.2, this.y - this.size * 0.2, 0, this.x, this
                        .y, this.size * 2.5);
                    grad.addColorStop(0, 'rgba(255,255,255,0.9)');
                    grad.addColorStop(0.5, this.color);
                    grad.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.globalAlpha = 0.35;
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }

                isDead() { return !this.alive; }
            }

            // ============================================================
            //  3. 真实城市天际线
            // ============================================================
            let buildings = [];

            function buildCity(scene) {
                buildings = [];
                let x = 0;
                const ground = H * 0.88;
                const isForest = (scene === 'forest');
                // 建筑密度大幅提升
                while (x < W + 30) {
                    let w, h;
                    if (isForest) {
                        w = rand(12, 40);
                        h = rand(20, 80) + Math.sin(x * 0.04) * 25;
                        const tree = {
                            x,
                            y: ground - h,
                            w,
                            h,
                            type: 'tree',
                            color: `hsl(${120 + rand(-15,15)}, ${rand(35,55)}%, ${rand(7,16)}%)`,
                            lights: []
                        };
                        // 树上有小光点
                        for (let i = 0; i < 3; i++) {
                            if (Math.random() < 0.2) {
                                tree.lights.push({
                                    lx: rand(2, w - 2),
                                    ly: rand(3, h - 3),
                                    size: rand(0.8, 1.5),
                                    phase: rand(0, Math.PI * 2)
                                });
                            }
                        }
                        buildings.push(tree);
                        x += w + rand(1, 5);
                    } else {
                        w = rand(15, 50);
                        h = rand(12, 75) + Math.sin(x * 0.025) * 18 + Math.sin(x * 0.06 + 1) * 10;
                        const b = {
                            x,
                            y: ground - h,
                            w,
                            h,
                            type: 'building',
                            color: `hsl(${40 + rand(-12,12)}, ${rand(20,35)}%, ${rand(5,13)}%)`,
                            lights: [],
                            roofType: Math.random() < 0.3 ? 'flat' : 'pointed'
                        };
                        // 窗户密度大幅增加
                        const cols = Math.floor(w / 6);
                        const rows = Math.floor(h / 8);
                        for (let row = 0; row < rows; row++) {
                            for (let col = 0; col < cols; col++) {
                                if (Math.random() < 0.35) {
                                    b.lights.push({
                                        lx: col * 6 + rand(1, 4),
                                        ly: row * 8 + rand(1, 4),
                                        size: rand(1.5, 3.5),
                                        phase: rand(0, Math.PI * 2),
                                        row: row,
                                        col: col
                                    });
                                }
                            }
                        }
                        buildings.push(b);
                        x += w + rand(1, 6);
                    }
                }
            }
            buildCity('grassland');

            function drawCity() {
                const groundY = H * 0.88;
                for (const b of buildings) {
                    ctx.fillStyle = b.color || '#0a101c';
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    // 屋顶装饰
                    if (b.type === 'building' && b.roofType === 'pointed') {
                        ctx.fillStyle = 'rgba(30,30,40,0.5)';
                        ctx.beginPath();
                        ctx.moveTo(b.x, b.y);
                        ctx.lineTo(b.x + b.w / 2, b.y - b.w * 0.4);
                        ctx.lineTo(b.x + b.w, b.y);
                        ctx.closePath();
                        ctx.fill();
                    }
                    // 窗户灯光（节拍同步）
                    if (b.type === 'building' && b.lights) {
                        for (const l of b.lights) {
                            // 节拍驱动灯光闪烁
                            const beatPhase = Math.sin(globalTime * 4 * Math.PI + l.phase);
                            let bright = 0.3 + 0.7 * (0.5 + 0.5 * beatPhase);
                            // 灯光模式叠加
                            if (lightingMode === 'pulse') {
                                bright *= 0.5 + 0.5 * Math.sin(globalTime * 4 * Math.PI + l.phase);
                            } else if (lightingMode === 'strobe') {
                                bright *= Math.floor(globalTime * 8) % 2 === 0 ? 1 : 0.05;
                            } else if (lightingMode === 'fade') {
                                bright *= 0.3 + 0.7 * (1 - globalTime / (lightingTimer || 1));
                            } else if (lightingMode === 'fadeout') {
                                bright *= Math.max(0, 1 - globalTime / (lightingTimer || 1));
                            } else if (lightingMode === 'off') {
                                bright *= 0.1;
                            } else if (lightingMode === 'wave') {
                                const wavePos = (l.row / 10 + l.col / 15 + globalTime * 0.5) % 1;
                                bright *= 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(wavePos * Math.PI * 2));
                            }
                            // 高潮时全亮
                            if (lightingMode === 'climax') {
                                bright = 0.8 + 0.2 * Math.sin(globalTime * 6 + l.phase);
                            }
                            ctx.fillStyle = `rgba(255,220,130,${clamp(bright * rand(0.7,1.2), 0, 1)})`;
                            ctx.fillRect(b.x + l.lx, b.y + l.ly, l.size, l.size * 1.4);
                        }
                    }
                    // 树冠光点
                    if (b.type === 'tree' && b.lights) {
                        for (const l of b.lights) {
                            const bright = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(globalTime * 3 + l.phase));
                            ctx.fillStyle = `rgba(200,255,180,${bright * 0.6})`;
                            ctx.beginPath();
                            ctx.arc(b.x + l.lx, b.y + l.ly, l.size, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                // 地面光晕
                ctx.fillStyle = 'rgba(20,40,20,0.12)';
                ctx.fillRect(0, groundY, W, H - groundY);
                // 地面灯光反射
                const grad = ctx.createLinearGradient(0, groundY, 0, H);
                grad.addColorStop(0, 'rgba(255,200,100,0.03)');
                grad.addColorStop(1, 'rgba(255,200,100,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, groundY, W, H - groundY);
            }

            // ============================================================
            //  4. 星空
            // ============================================================
            function initStars() {
                stars = [];
                for (let i = 0; i < 250; i++) {
                    stars.push({
                        x: rand(0, W),
                        y: rand(0, H * 0.7),
                        r: rand(0.3, 2.2),
                        a: rand(0.2, 0.95),
                        speed: rand(0.002, 0.018),
                        twinkle: rand(0, Math.PI * 2)
                    });
                }
            }
            initStars();

            // ============================================================

                    }
                }
                events.push({ t: 278, type: 'lighting', mode: 'strobe', dur: 4 });

                // 280-310s 副歌
                for (let i = 0; i < 14; i++) {
                    const t = 280 + i * 2.2;
                    const cx = 0.2 + (i % 5) * 0.15;
                    const shapeList = ['peony', 'ring', 'chrysanthemum', 'normal', 'peony'];
                    const sh = shapeList[i % shapeList.length];
                    const themeList = ['rainbow', 'forest', 'gold', 'purple', 'ice'];
                    const th = themeList[i % themeList.length];
                    events.push({ t: t, type: 'array', x: cx, y: 0.88, count: 70 + i * 10, spread: 200 + i * 15,
                        theme: th, angleSpread: 70 + i * 8, shape: 'meteor' });
                    if (i % 2 === 0) {
                        events.push({ t: t + 0.4, type: 'salute', count: 4, spread: 150, theme: th, burst: 180 + i *
                                10, sub: 2, shape: sh });
                    }
                    if (i % 3 === 0) {
                        events.push({ t: t + 0.8, type: 'salute', count: 3, spread: 130, theme: 'gold', burst: 170 + i *
                                10, sub: 2, shape: 'ring' });
                    }
                }
                events.push({ t: 308, type: 'lighting', mode: 'climax', dur: 5 });

                // 310-340s 过渡
                for (let i = 0; i < 10; i++) {
                    const t = 310 + i * 3;
                    events.push({ t: t, type: 'array', x: 0.3 + (i % 3) * 0.2, y: 0.88, count: 35 + i * 4, spread: 130 +
                            i * 10, theme: i % 2 === 0 ? 'cool' : 'forest', angleSpread: 40 + i * 4, shape: 'meteor' });
                    if (i % 2 === 0) {
                        events.push({ t: t + 0.8, type: 'salute', count: 2, spread: 90, theme: 'ice', burst: 120 + i *
                                8, sub: 1, shape: 'normal' });
                    }
                }
                events.push({ t: 338, type: 'lighting', mode: 'pulse', dur: 4 });

                // 340-370s 大高潮
                for (let i = 0; i < 16; i++) {
                    const t = 340 + i * 1.9;
                    const cx = 0.15 + (i % 5) * 0.175;
                    const shapeList = ['peony', 'chrysanthemum', 'ring', 'peony', 'normal', 'peony'];
                    const sh = shapeList[i % shapeList.length];
                    const themeList = ['rainbow', 'fire', 'gold', 'purple', 'forest', 'rainbow'];
                    const th = themeList[i % themeList.length];
                    events.push({ t: t, type: 'array', x: cx, y: 0.88, count: 90 + i * 14, spread: 240 + i * 18,
                        theme: th, angleSpread: 90 + i * 10, shape: 'meteor' });
                    if (i % 2 === 0) {
                        events.push({ t: t + 0.3, type: 'salute', count: 5, spread: 170, theme: th, burst: 210 + i *
                                14, sub: 3, shape: sh });
                    }
                    if (i % 3 === 0) {
                        events.push({ t: t + 0.6, type: 'salute', count: 4, spread: 150, theme: 'gold', burst: 200 + i *
                                14, sub: 3, shape: 'ring' });
                    }
                    if (i % 4 === 0) {
                        events.push({ t: t + 0.9, type: 'salute', count: 3, spread: 130, theme: 'purple', burst: 180 + i *
                                14, sub: 2, shape: 'chrysanthemum' });
                    }
                }
                events.push({ t: 368, type: 'lighting', mode: 'climax', dur: 6 });

                // 370-400s 回落
                for (let i = 0; i < 10; i++) {
                    const t = 370 + i * 3;
                    events.push({ t: t, type: 'array', x: 0.3 + (i % 3) * 0.2, y: 0.88, count: 30 + i * 3, spread: 120 +
                            i * 8, theme: 'cool', angleSpread: 35 + i * 3, shape: 'meteor' });
                    if (i % 3 === 0) {
                        events.push({ t: t + 0.8, type: 'salute', count: 1, spread: 60, theme: 'ice', burst: 100 + i *
                                6, sub: 1, shape: 'normal' });
                    }
                }
                events.push({ t: 398, type: 'lighting', mode: 'fadeout', dur: 5 });

                // 400-420s 最后爆发
                for (let i = 0; i < 10; i++) {
                    const t = 400 + i * 2;
                    const cx = 0.2 + (i % 4) * 0.2;
                    const shapeList = ['peony', 'ring', 'chrysanthemum', 'peony'];
                    const sh = shapeList[i % shapeList.length];
                    const themeList = ['rainbow', 'gold', 'purple', 'fire'];
                    const th = themeList[i % themeList.length];
                    events.push({ t: t, type: 'array', x: cx, y: 0.88, count: 80 + i * 12, spread: 220 + i * 16,
                        theme: th, angleSpread: 80 + i * 8, shape: 'meteor' });
                    if (i % 2 === 0) {
                        events.push({ t: t + 0.4, type: 'salute', count: 4, spread: 160, theme: th, burst: 200 + i *
                                12, sub: 3, shape: sh });
                    }
                    if (i % 3 === 0) {
                        events.push({ t: t + 0.8, type: 'salute', count: 3, spread: 140, theme: 'gold', burst: 190 + i *
                                12, sub: 2, shape: 'ring' });
                    }
                }
                events.push({ t: 418, type: 'lighting', mode: 'climax', dur: 4 });

                // 420-460s 尾奏
                for (let i = 0; i < 12; i++) {
                    const t = 420 + i * 3.2;
                    const cx = 0.5 + Math.sin(i * 0.8) * 0.25;
                    events.push({ t: t, type: 'array', x: cx, y: 0.88, count: 20 + i * 2, spread: 80 + i * 6,
                        theme: i % 2 === 0 ? 'white' : 'ice', angleSpread: 25 + i * 3, shape: 'meteor' });
                    if (i % 4 === 0 && i > 0) {
                        events.push({ t: t + 0.6, type: 'salute', count: 1, spread: 50, theme: 'white', burst: 70 + i *
                                4, sub: 0, shape: 'normal' });
                    }
                }
                events.push({ t: 455, type: 'lighting', mode: 'off', dur: 5 });

                return events;
            }

            // ============================================================
            //  6. 事件执行器
            // ============================================================
            function executeEvent(ev) {
                const key = `${ev.t}-${ev.type}`;
                if (executedEvents.has(key)) return;
                executedEvents.add(key);

                switch (ev.type) {
                    case 'scene': {
                        const scene = ev.scene;
                        if (scene === 'forest') {
                            targetBg = { top: '#0a0a2a', bottom: '#0a2a3a', ground: '#0a1a1a' };
                            currentScene = 'forest';
                            buildCity('forest');
                            songLabel.textContent = '鹿 be free';
                        } else {
                            targetBg = { top: '#0a1a2a', bottom: '#0a2a1a', ground: '#0a1a0a' };
                            currentScene = 'grassland';
                            buildCity('grassland');
                            songLabel.textContent = '我乘着风飞过来';
                        }
                        sceneTransition = 0;
                        break;
                    }
                    case 'lighting': {
                        lightingMode = ev.mode;
                        lightingTimer = ev.dur * 60;
                        break;
                    }
                    case 'salute': {
                        const centerX = W * 0.5 + rand(-W * 0.12, W * 0.12);
                        const count = ev.count || 2;
                        const spread = ev.spread || 100;
                        const theme = ev.theme || 'warm';
                        const burst = ev.burst || 120;
                        const sub = ev.sub || 2;
                        const shape = ev.shape || 'normal';
                        let hueBase = rand(0, 360);
                        if (theme === 'warm') hueBase = rand(10, 50);
                        else if (theme === 'cool') hueBase = rand(180, 260);
                        else if (theme === 'gold') hueBase = rand(35, 50);
                        else if (theme === 'purple') hueBase = rand(270, 320);
                        else if (theme === 'fire') hueBase = rand(0, 30);
                        else if (theme === 'ice') hueBase = rand(190, 230);
                        else if (theme === 'forest') hueBase = rand(90, 150);
                        else if (theme === 'rainbow') hueBase = rand(0, 360);
                        else if (theme === 'white') hueBase = 0;
                        for (let i = 0; i < count; i++) {
                            const offsetX = rand(-spread / 2, spread / 2);
                            const x = clamp(centerX + offsetX, 30, W - 30);
                            const targetY = rand(H * 0.08, H * 0.4);
                            const col = theme === 'white' ? '#ffffff' : hsl(hueBase + rand(-20, 20), rand(80, 100), rand(50,
                                75));
                            const rocket = new Rocket({
                                x: x,
                                y: H + rand(0, 20),
                                targetX: x + rand(-15, 15),
                                targetY: targetY,
                                color: col,
                                size: rand(3, 5.5),
                                isArray: false,
                                burstCount: burst + randInt(-20, 20),
                                subBursts: sub + randInt(-1, 1),
                                hueBase: hueBase + rand(-10, 10),
                                theme: theme,
                                shape: shape
                            });
                            if (rockets.length < MAX_ROCKETS) rockets.push(rocket);
                        }
                        break;
                    }
                    case 'array': {
                        const cx = ev.x * W;
                        const cy = ev.y * H;
                        const count = ev.count || 40;
                        const spread = ev.spread || 140;
                        const theme = ev.theme || 'warm';
                        const angleSpread = ev.angleSpread || 60;
                        const shape = ev.shape || 'meteor';
                        let hueBase = rand(0, 360);
                        if (theme === 'warm') hueBase = rand(10, 50);
                        else if (theme === 'cool') hueBase = rand(180, 260);
                        else if (theme === 'gold') hueBase = rand(35, 50);
                        else if (theme === 'purple') hueBase = rand(270, 320);
                        else if (theme === 'fire') hueBase = rand(0, 30);
                        else if (theme === 'ice') hueBase = rand(190, 230);
                        else if (theme === 'forest') hueBase = rand(90, 150);
                        else if (theme === 'rainbow') hueBase = rand(0, 360);
                        else if (theme === 'white') hueBase = 0;

                        const angleRad = angleSpread * Math.PI / 180;
                        const startAngle = -angleRad / 2;
                        const step = angleRad / (count - 1 || 1);
                        const halfSpread = spread * 0.5;
                        for (let i = 0; i < count; i++) {
                            const angle = startAngle + i * step;
                            const dist = rand(halfSpread * 0.25, halfSpread * 0.85);
                            const tx = cx + Math.sin(angle) * dist;
                            const ty = cy - Math.cos(angle) * dist * 0.5 - rand(15, 50);
                            const targetY = clamp(ty, H * 0.05, H * 0.5);
                            const col = theme === 'white' ? '#ffffff' : hsl(hueBase + rand(-12, 12), rand(80, 100), rand(50,
                                75));
                            const rocket = new Rocket({
                                x: cx + rand(-12, 12),
                                y: H + rand(0, 15),
                                targetX: tx + rand(-20, 20),
                                targetY: targetY,
                                color: col,
                                size: rand(1.8, 3.8),
                                isArray: true,
                                hueBase: hueBase + rand(-10, 10),
                                theme: theme,
                                shape: shape
                            });
                            const delay = i * 15 + rand(0, 8);
                            setTimeout(() => {
                                if (isPlaying && !isPaused && rockets.length < MAX_ROCKETS) {
                                    rockets.push(rocket);
                                }
                            }, delay);
                        }
                        break;
                    }
                }
            }

            // ============================================================
            //  7. 音乐加载与控制
            // ============================================================
            function loadAudio() {
                return new Promise((resolve) => {
                    audio1 = new Audio(SONGS[0].url);
                    audio2 = new Audio(SONGS[1].url);
                    audio1.preload = 'auto';
                    audio2.preload = 'auto';
                    let loaded = 0;
                    const total = 2;

                    function onLoad() {
                        loaded++;
                        loadFill.style.width = `${(loaded / total) * 100}%`;
                        if (loaded === total) {
                            isAudioLoaded = true;
                            loadStatus.textContent = '✅ 加载完成，点击开启！';
                            resolve();
                        }
                    }
                    audio1.addEventListener('canplaythrough', onLoad);
                    audio2.addEventListener('canplaythrough', onLoad);
                    audio1.addEventListener('error', () => { console.warn('音频1加载失败，使用模拟模式');
                        onLoad(); });
                    audio2.addEventListener('error', () => { console.warn('音频2加载失败，使用模拟模式');
                        onLoad(); });
                    setTimeout(() => {
                        if (!isAudioLoaded) {
                            console.warn('加载超时，强制继续');
                            isAudioLoaded = true;
                            loadStatus.textContent = '⚠️ 加载超时，点击继续';
                            loadFill.style.width = '100%';
                            resolve();
                        }
                    }, 10000);
                    audio1.load();
                    audio2.load();
                });
            }

            function startShow() {
                if (!isAudioLoaded) return;
                overlay.classList.add('hidden');
                controls.classList.add('visible');
                if (audio1.readyState >= 2) {
                    audio1.currentTime = 0;
                    audio1.play().catch(e => console.warn('播放失败:', e));
                }
                if (audio2.readyState >= 2) {
                    audio2.pause();
                    audio2.currentTime = 0;
                }
                isPlaying = true;
                isPaused = false;
                elapsedTime = 0;
                globalTime = 0;
                executedEvents.clear();
                schedule = buildSchedule();
                particles = [];
                rockets = [];
                songIndex = 0;
                btnPlayPause.textContent = '⏸';
                currentBg = { ...targetBg };
                buildCity('grassland');
                songLabel.textContent = '我乘着风飞过来';
                lastTimestamp = performance.now();
                startTime = lastTimestamp;
                if (animFrameId) cancelAnimationFrame(animFrameId);
                mainLoop();
            }

            function togglePlayPause() {
                if (!isPlaying) return;
                isPaused = !isPaused;
                btnPlayPause.textContent = isPaused ? '▶' : '⏸';
                if (isPaused) {
                    if (audio1) audio1.pause();
                    if (audio2) audio2.pause();
                } else {
                    if (audio1 && songIndex === 0) audio1.play().catch(e => {});
                    if (audio2 && songIndex === 1) audio2.play().catch(e => {});
                    lastTimestamp = performance.now();
                }
            }

            function resetShow() {
                isPaused = true;
                btnPlayPause.textContent = '▶';
                if (audio1) { audio1.pause();
                    audio1.currentTime = 0; }
                if (audio2) { audio2.pause();
                    audio2.currentTime = 0; }
                particles = [];
                rockets = [];
                elapsedTime = 0;
                globalTime = 0;
                executedEvents.clear();
                songIndex = 0;
                songLabel.textContent = '我乘着风飞过来';
                currentBg = { top: '#0a1a2a', bottom: '#0a2a1a', ground: '#0a1a0a' };
                targetBg = { top: '#0a1a2a', bottom: '#0a2a1a', ground: '#0a1a0a' };
                buildCity('grassland');
                lightingMode = 'off';
                lightingTimer = 0;
                setTimeout(() => {
                    isPaused = false;
                    btnPlayPause.textContent = '⏸';
                    if (audio1) { audio1.currentTime = 0;
                        audio1.play().catch(e => {}); }
                    lastTimestamp = performance.now();
                    executedEvents.clear();
                    schedule = buildSchedule();
                }, 300);
            }

            // ============================================================
            //  8. 主循环
            // ============================================================
            function mainLoop() {
                if (!isPlaying) return;
                const now = performance.now();
                const delta = isPaused ? 0 : (now - lastTimestamp) / 1000;
                lastTimestamp = now;

                if (!isPaused) {
                    elapsedTime += delta;
                    globalTime += delta;
                    // 节拍
                    beatCounter += delta;
                    if (beatCounter >= BEAT_INTERVAL) {
                        beatCounter -= BEAT_INTERVAL;
                        lastBeatTime = globalTime;
                    }

                    if (elapsedTime >= 232 && songIndex === 0) {
                        songIndex = 1;
                        if (audio1) audio1.pause();
                        if (audio2) {
                            audio2.currentTime = elapsedTime - 232;
                            audio2.play().catch(e => {});
                        }
                    }

                    // 执行事件
                    for (const ev of schedule) {
                        if (ev.t <= elapsedTime && !executedEvents.has(`${ev.t}-${ev.type}`)) {
                            executeEvent(ev);
                        }
                    }

                    // 场景过渡
                    if (sceneTransition < 1) {
                        sceneTransition += delta * 0.25;
                        if (sceneTransition > 1) sceneTransition = 1;
                        const t = sceneTransition;
                        currentBg.top = lerpColor(currentBg.top, targetBg.top, t);
                        currentBg.bottom = lerpColor(currentBg.bottom, targetBg.bottom, t);
                        currentBg.ground = lerpColor(currentBg.ground, targetBg.ground, t);
                    }

                    // 更新粒子
                    for (let i = particles.length - 1; i >= 0; i--) {
                        particles[i].update();
                        if (particles[i].isDead()) particles.splice(i, 1);
                    }
                    // 更新火箭
                    for (let i = rockets.length - 1; i >= 0; i--) {
                        rockets[i].update();
                        if (rockets[i].isDead()) rockets.splice(i, 1);
                    }
                    if (particles.length > MAX_PARTICLES) {
                        particles.splice(0, particles.length - MAX_PARTICLES);
                    }
                    if (lightingTimer > 0) {
                        lightingTimer -= delta * 60;
                        if (lightingTimer < 0) lightingTimer = 0;
                    }
                }

                // ---- 绘制 ----
                // 背景
                const grad = ctx.createLinearGradient(0, 0, 0, H);
                grad.addColorStop(0, currentBg.top);
                grad.addColorStop(0.6, currentBg.bottom);
                grad.addColorStop(1, '#020408');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // 星空
                for (const s of stars) {
                    s.a += (Math.random() - 0.5) * 0.02;
                    s.a = clamp(s.a, 0.15, 0.95);
                    ctx.globalAlpha = s.a * 0.8;
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;

                // 城市
                drawCity();

                // 粒子
                for (const p of particles) p.draw(ctx);
                // 火箭
                for (const r of rockets) r.draw(ctx);

                // ---- UI ----
                const total = TOTAL_DURATION;
                const current = Math.min(elapsedTime, total);
                const min = Math.floor(current / 60);
                const sec = Math.floor(current % 60);
                const tMin = Math.floor(total / 60);
                const tSec = Math.floor(total % 60);
                timeDisplay.textContent =
                    `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')} / ${String(tMin).padStart(2,'0')}:${String(tSec).padStart(2,'0')}`;

                if (elapsedTime >= total && !isPaused) {
                    isPaused = true;
                    btnPlayPause.textContent = '▶';
                    if (audio1) audio1.pause();
                    if (audio2) audio2.pause();
                }

                animFrameId = requestAnimationFrame(mainLoop);
            }

            function lerpColor(hex1, hex2, t) {
                const c1 = hexToRgb(hex1);
                const c2 = hexToRgb(hex2);
                const r = Math.round(lerp(c1[0], c2[0], t));
                const g = Math.round(lerp(c1[1], c2[1], t));
                const b = Math.round(lerp(c1[2], c2[2], t));
                return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
            }

            // ============================================================
            //  9. 初始化
            // ============================================================
            btnStart.addEventListener('click', () => {
                if (!isAudioLoaded) {
                    loadStatus.textContent = '⏳ 正在加载...';
                    loadAudio().then(startShow);
                } else {
                    startShow();
                }
            });
            btnPlayPause.addEventListener('click', togglePlayPause);
            btnReset.addEventListener('click', resetShow);
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); if (isPlaying) togglePlayPause(); }
                if (e.key === 'r' || e.key === 'R') { if (isPlaying) resetShow(); }
            });

            loadStatus.textContent = '⏳ 加载音乐中...';
            loadAudio().then(() => {});
            window.addEventListener('resize', () => {
                resize();
                initStars();
                buildCity(currentScene);
            });
            // 初始绘制
            const grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a1a2a');
            grad.addColorStop(0.6, '#0a2a1a');
            grad.addColorStop(1, '#020408');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);
            for (const s of stars) {
                ctx.globalAlpha = s.a * 0.7;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            drawCity();
            console.log('🎆 史诗级烟花盛典已加载！');
            console.log('🔥 5种造型 · 密集阵列 · 节拍灯光 · 真实城市');
        })();
    </script>
</body>
