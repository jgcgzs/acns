<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>极创博客 - 极光创工作室</title>
    <meta name="description" content="极光创工作室博客 - 迷你世界创作分享">
    <link rel="shortcut icon" href="https://user-assets.sxlcdn.com/images/1291382/FuDaZWAs3_92-0wUCjGg2zRMiHe5.png?imageMogr2/strip/auto-orient/thumbnail/64x64>/quality/90!/format/png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <style>
        /* ===== 基础变量 ===== */
        :root {
            --blue-primary: #1a7fc4;
            --blue-primary-dark: #0f6aad;
            --blue-bg-light: #ecf5fa;
            --blue-bg-pale: #f5f9fe;
            --white: #ffffff;
            --text-dark: #1a2a3a;
            --text-muted: #4a5a6a;
            --border-light: #dce6ef;
            --shadow-sm: 0 2px 12px rgba(26, 127, 196, 0.07);
            --shadow-hover: 0 8px 28px rgba(26, 127, 196, 0.14);
            --radius: 2px;
            --bg-body: #f5f9fe;
            --bg-card: #ffffff;
            --card-border: #dce6ef;
            --text-color: #1a2a3a;
            --text-secondary: #4a5a6a;
            --tag-border: #1a7fc4;
            --tag-color: #1a7fc4;
            --tag-bg: transparent;
            --nav-bg: #ffffff;
            --nav-border: #dce6ef;
            --nav-text: #222222;
            --nav-text-hover: #1a7fc4;
            --filter-bg: transparent;
            --filter-border: #dce6ef;
            --filter-text: #4a5a6a;
            --filter-active-bg: #1a7fc4;
            --filter-active-text: #fff;
            --filter-active-border: #1a7fc4;
            --notice-bg: #e8f2fa;
            --notice-border: #dce6ef;
            --shadow-glow: 0 0 30px rgba(26, 127, 196, 0.08);
        }

        /* ============================================================
           ★★★ 暗黑剧场模式（言行大帝）★★★
           更灵动、更富戏剧感
           ============================================================ */
        body.theater-mode {
            --bg-body: #0d0a1a;
            --bg-card: #161025;
            --card-border: #3a2a5a;
            --text-color: #e8dcc8;
            --text-secondary: #b0a090;
            --tag-border: #d4a050;
            --tag-color: #d4a050;
            --tag-bg: rgba(212, 160, 80, 0.12);
            --nav-bg: #0d0a1a;
            --nav-border: #3a2a5a;
            --nav-text: #d4c8b0;
            --nav-text-hover: #e8c84a;
            --filter-bg: rgba(255, 255, 255, 0.03);
            --filter-border: #3a2a5a;
            --filter-text: #b0a090;
            --filter-active-bg: #d4a050;
            --filter-active-text: #0d0a1a;
            --filter-active-border: #d4a050;
            --shadow-sm: 0 4px 24px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 8px 48px rgba(212, 160, 80, 0.15);
            --shadow-glow: 0 0 60px rgba(212, 160, 80, 0.06);
            --notice-bg: rgba(212, 160, 80, 0.05);
            --notice-border: #3a2a5a;
        }

        /* 导航栏暗黑 */
        body.theater-mode .navbar {
            background: #0d0a1a !important;
            border-bottom-color: #3a2a5a !important;
            box-shadow: 0 2px 40px rgba(0, 0, 0, 0.6) !important;
        }
        body.theater-mode .navbar .brand-text {
            color: #e8dcc8 !important;
        }
        body.theater-mode .navbar .nav-links li a {
            color: #b0a090 !important;
        }
        body.theater-mode .navbar .nav-links li a:hover {
            color: #e8c84a !important;
            background: rgba(212, 160, 80, 0.08) !important;
        }
        body.theater-mode .navbar .nav-links li a.active {
            color: #e8c84a !important;
        }
        body.theater-mode .navbar .nav-links li a::after {
            background: #e8c84a !important;
        }
        body.theater-mode .navbar .menu-toggle {
            color: #e8dcc8 !important;
        }

        /* 底部暗黑 */
        body.theater-mode .footer {
            background: #08061a !important;
            border-top-color: #2a1a4a !important;
        }
        body.theater-mode .footer .container {
            color: #6a5a4a !important;
        }

        /* 页面头部暗黑 */
        body.theater-mode .page-header {
            border-bottom-color: #3a2a5a !important;
        }
        body.theater-mode .page-header h1 {
            color: #e8dcc8 !important;
        }
        body.theater-mode .page-header .sub {
            color: #8a7a6a !important;
        }

        /* 搜索栏暗黑 */
        body.theater-mode .blog-toolbar .search-box {
            border-color: #3a2a5a !important;
            background: rgba(255, 255, 255, 0.04) !important;
        }
        body.theater-mode .blog-toolbar .search-box input {
            color: #e8dcc8 !important;
            background: transparent !important;
        }
        body.theater-mode .blog-toolbar .search-box input::placeholder {
            color: #5a4a3a !important;
        }
        body.theater-mode .blog-toolbar .search-box button {
            color: #8a7a6a !important;
        }
        body.theater-mode .blog-toolbar .search-box button:hover {
            color: #e8c84a !important;
        }
        body.theater-mode .blog-toolbar .result-count {
            color: #8a7a6a !important;
        }

        /* 分类按钮暗黑 */
        body.theater-mode .blog-categories-filter .filter-btn {
            border-color: #3a2a5a !important;
            color: #8a7a6a !important;
            background: rgba(255, 255, 255, 0.02) !important;
        }
        body.theater-mode .blog-categories-filter .filter-btn:hover {
            border-color: #d4a050 !important;
            color: #e8c84a !important;
            background: rgba(212, 160, 80, 0.06) !important;
        }
        body.theater-mode .blog-categories-filter .filter-btn.active {
            background: #d4a050 !important;
            border-color: #d4a050 !important;
            color: #0d0a1a !important;
            box-shadow: 0 0 30px rgba(212, 160, 80, 0.2) !important;
        }
        body.theater-mode .blog-categories-filter .filter-btn.all-btn {
            border-color: #d4a050 !important;
            color: #d4a050 !important;
        }
        body.theater-mode .blog-categories-filter .filter-btn.all-btn.active {
            background: #d4a050 !important;
            color: #0d0a1a !important;
        }
        body.theater-mode .blog-categories-filter .filter-btn.theater-btn {
            border-color: #d4a050 !important;
            color: #d4a050 !important;
            box-shadow: 0 0 20px rgba(212, 160, 80, 0.1);
        }
        body.theater-mode .blog-categories-filter .filter-btn.theater-btn.active {
            background: #d4a050 !important;
            color: #0d0a1a !important;
            box-shadow: 0 0 40px rgba(212, 160, 80, 0.3) !important;
        }

        /* 博客卡片暗黑 - 增加浮动和光晕效果 */
        body.theater-mode .blog-card {
            border-color: #3a2a5a !important;
            background: linear-gradient(145deg, #161025, #1a0f30) !important;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(212, 160, 80, 0.05) !important;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
        }
        body.theater-mode .blog-card:hover {
            border-color: #d4a050 !important;
            transform: translateY(-6px) scale(1.01) !important;
            box-shadow: 0 12px 48px rgba(212, 160, 80, 0.12), 0 0 60px rgba(212, 160, 80, 0.04) !important;
        }
        body.theater-mode .blog-card .body .tag {
            border-color: #d4a050 !important;
            color: #d4a050 !important;
            background: rgba(212, 160, 80, 0.08) !important;
            box-shadow: 0 0 12px rgba(212, 160, 80, 0.04) !important;
        }
        body.theater-mode .blog-card .body .title {
            color: #f0e4d0 !important;
            text-shadow: 0 0 20px rgba(212, 160, 80, 0.04) !important;
        }
        body.theater-mode .blog-card .body .date-row {
            color: #6a5a4a !important;
        }
        body.theater-mode .blog-card .body .author {
            color: #8a7a6a !important;
        }
        body.theater-mode .blog-card .body .author:hover {
            color: #e8c84a !important;
        }
        body.theater-mode .blog-card .body .summary {
            color: #c0b0a0 !important;
        }
        body.theater-mode .blog-card .body .read-more {
            color: #d4a050 !important;
        }
        body.theater-mode .blog-card .body .read-more:hover {
            color: #e8c84a !important;
        }

        /* 分页暗黑 */
        body.theater-mode .pagination button {
            border-color: #3a2a5a !important;
            background: rgba(255, 255, 255, 0.03) !important;
            color: #8a7a6a !important;
        }
        body.theater-mode .pagination button:hover:not(:disabled) {
            border-color: #d4a050 !important;
            color: #e8c84a !important;
            background: rgba(212, 160, 80, 0.06) !important;
            box-shadow: 0 0 20px rgba(212, 160, 80, 0.08) !important;
        }
        body.theater-mode .pagination button.active {
            background: #d4a050 !important;
            border-color: #d4a050 !important;
            color: #0d0a1a !important;
            box-shadow: 0 0 30px rgba(212, 160, 80, 0.2) !important;
        }
        body.theater-mode .pagination .info {
            color: #6a5a4a !important;
        }

        /* 加载 & 空状态暗黑 */
        body.theater-mode .loading-placeholder {
            color: #8a7a6a !important;
        }
        body.theater-mode .loading-placeholder i {
            color: #d4a050 !important;
        }
        body.theater-mode .empty-placeholder {
            color: #8a7a6a !important;
        }
        body.theater-mode .blog-error {
            color: #8a7a6a !important;
        }
        body.theater-mode .blog-error i {
            color: #d4a050 !important;
        }

        /* ============================================================
           滚动条暗黑
           ============================================================ */
        body.theater-mode ::-webkit-scrollbar-track {
            background: #1a0f30 !important;
        }
        body.theater-mode ::-webkit-scrollbar-thumb {
            background: #3a2a5a !important;
            border-radius: 4px !important;
        }
        body.theater-mode ::-webkit-scrollbar-thumb:hover {
            background: #d4a050 !important;
        }

        /* ============================================================
           全局样式
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            line-height: 1.7;
            font-size: 16px;
            padding-top: 68px;
            transition: background-color 0.6s ease, color 0.6s ease;
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
        }
        .container {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ===== 导航栏 ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: var(--nav-bg);
            height: 68px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--nav-border);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .navbar-brand .logo {
            height: 36px;
            width: auto;
        }
        .navbar-brand .brand-text {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 0.3px;
            white-space: nowrap;
            transition: color 0.5s ease;
        }
        .nav-links {
            display: flex;
            gap: 2px;
            list-style: none;
        }
        .nav-links li a {
            display: block;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 500;
            color: var(--nav-text);
            border-radius: var(--radius);
            transition: background 0.3s ease, color 0.3s ease;
            position: relative;
        }
        .nav-links li a::after {
            content: '';
            position: absolute;
            bottom: 2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--blue-primary);
            transition: width 0.3s ease, background 0.3s ease;
            transform: translateX(-50%);
            border-radius: var(--radius);
        }
        .nav-links li a:hover {
            background: var(--blue-bg-light);
            color: var(--nav-text-hover);
        }
        .nav-links li a:hover::after {
            width: 50%;
        }
        .nav-links li a.active {
            color: var(--blue-primary);
            font-weight: 600;
        }
        .nav-links li a.active::after {
            width: 50%;
        }
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--nav-text);
            cursor: pointer;
            padding: 4px 8px;
            transition: color 0.5s ease;
        }

        /* ===== 底部 ===== */
        .footer {
            background: #1a2a3a;
            color: rgba(255, 255, 255, 0.55);
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 48px;
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .footer .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .footer .sep {
            color: rgba(255, 255, 255, 0.12);
        }

        /* ===== 页面头部 ===== */
        .page-header {
            padding: 24px 0 12px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 24px;
            transition: border-color 0.5s ease;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-dark);
            transition: color 0.5s ease;
        }
        .page-header .sub {
            font-size: 14px;
            color: var(--text-muted);
            opacity: 0.6;
            transition: color 0.5s ease;
        }

        /* ===== 搜索 + 分类工具栏 ===== */
        .blog-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin-bottom: 16px;
            align-items: center;
        }
        .blog-toolbar .search-box {
            flex: 1;
            min-width: 200px;
            display: flex;
            gap: 0;
            border: 1px solid var(--border-light);
            background: var(--white);
            transition: border-color 0.3s ease, background 0.5s ease;
        }
        .blog-toolbar .search-box:focus-within {
            border-color: var(--blue-primary);
        }
        .blog-toolbar .search-box input {
            flex: 1;
            padding: 8px 14px;
            border: none;
            background: transparent;
            color: var(--text-dark);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: color 0.5s ease;
        }
        .blog-toolbar .search-box input::placeholder {
            color: var(--text-muted);
            opacity: 0.5;
        }
        .blog-toolbar .search-box button {
            padding: 8px 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .blog-toolbar .search-box button:hover {
            color: var(--blue-primary);
        }
        .blog-toolbar .result-count {
            font-size: 13px;
            color: var(--text-muted);
            opacity: 0.5;
            white-space: nowrap;
            transition: color 0.5s ease;
        }

        /* ===== 分类筛选（横向滚动） ===== */
        .blog-categories-filter {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 6px 10px;
            margin-bottom: 20px;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .blog-categories-filter::-webkit-scrollbar {
            height: 4px;
            background: var(--border-light);
            border-radius: 4px;
        }
        .blog-categories-filter::-webkit-scrollbar-thumb {
            background: var(--blue-primary);
            border-radius: 4px;
        }
        .blog-categories-filter .filter-btn {
            flex: 0 0 auto;
            padding: 4px 16px;
            font-size: 12px;
            font-weight: 500;
            border: 1.5px solid var(--filter-border);
            border-radius: 20px;
            background: var(--filter-bg);
            color: var(--filter-text);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            font-family: inherit;
            white-space: nowrap;
        }
        .blog-categories-filter .filter-btn:hover {
            border-color: var(--blue-primary);
            color: var(--blue-primary);
        }
        .blog-categories-filter .filter-btn.active {
            border-color: var(--filter-active-border);
            color: var(--filter-active-text);
            background: var(--filter-active-bg);
        }
        .blog-categories-filter .filter-btn.all-btn {
            border-color: var(--blue-primary);
            color: var(--blue-primary);
        }
        .blog-categories-filter .filter-btn.all-btn.active {
            background: var(--blue-primary);
            color: #fff;
        }
        .blog-categories-filter .filter-btn.theater-btn {
            border-color: #d4a050;
            color: #d4a050;
        }
        .blog-categories-filter .filter-btn.theater-btn.active {
            background: #d4a050;
            color: #0d0a1a;
        }

        /* ===== 博客网格 ===== */
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin: 4px 0 8px;
        }
        .blog-card {
            background: var(--bg-card);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                border-color 0.4s ease,
                background 0.5s ease;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .blog-card:hover {
            box-shadow: var(--shadow-hover);
            border-color: var(--blue-primary);
            transform: translateY(-3px);
        }
        .blog-card .body {
            padding: 14px 16px 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .blog-card .body .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 6px;
            margin-bottom: 2px;
        }
        .blog-card .body .tag {
            font-size: 10px;
            font-weight: 600;
            padding: 1px 10px;
            border: 1.5px solid var(--tag-border);
            color: var(--tag-color);
            background: var(--tag-bg);
            border-radius: 3px;
            letter-spacing: 0.3px;
            display: inline-block;
            line-height: 1.5;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .blog-card .body .tag:hover {
            transform: translateY(-1px);
        }
        .blog-card .body .title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.5s ease;
        }
        .blog-card .body .date-row {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.55;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.5s ease;
        }
        .blog-card .body .date-row i {
            font-size: 11px;
            opacity: 0.5;
        }
        .blog-card .body .author {
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.6;
            display: flex;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .blog-card .body .author:hover {
            color: var(--blue-primary);
            text-decoration: underline;
        }
        .blog-card .body .author i {
            font-size: 10px;
            opacity: 0.5;
        }
        .blog-card .body .summary {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
            flex: 1;
            transition: color 0.5s ease;
        }
        .blog-card .body .read-more {
            font-size: 12px;
            font-weight: 600;
            color: var(--blue-primary);
            margin-top: 4px;
            align-self: flex-start;
            transition: color 0.4s ease;
        }
        .blog-card .body .read-more i {
            font-size: 11px;
            transition: transform 0.3s ease;
        }
        .blog-card:hover .read-more i {
            transform: translateX(4px);
        }

        /* ===== 分页 ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 6px 14px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            background: var(--white);
            color: var(--text-dark);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                background 0.5s ease,
                border-color 0.5s ease,
                color 0.5s ease;
            min-width: 36px;
        }
        .pagination button:hover:not(:disabled) {
            border-color: var(--blue-primary);
            color: var(--blue-primary);
        }
        .pagination button.active {
            background: var(--blue-primary);
            color: #fff;
            border-color: var(--blue-primary);
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .pagination .info {
            font-size: 13px;
            color: var(--text-muted);
            opacity: 0.5;
            padding: 0 8px;
            transition: color 0.5s ease;
        }

        /* ===== 加载 & 空状态 ===== */
        .loading-placeholder,
        .empty-placeholder {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
            opacity: 0.4;
            font-size: 15px;
            grid-column: 1 / -1;
            transition: color 0.5s ease;
        }
        .loading-placeholder i {
            display: block;
            font-size: 28px;
            color: var(--blue-primary);
            margin-bottom: 10px;
            transition: color 0.5s ease;
        }
        .blog-error {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
            grid-column: 1 / -1;
            transition: color 0.5s ease;
        }
        .blog-error i {
            display: block;
            font-size: 28px;
            color: #ef4444;
            margin-bottom: 10px;
        }

        /* ============================================================
           响应式
           ============================================================ */
        @media (max-width: 992px) {
            .blog-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 768px) {
            body {
                padding-top: 60px;
            }
            .navbar {
                height: 60px;
            }
            .menu-toggle {
                display: block;
            }
            .nav-links {
                display: none;
                position: absolute;
                top: 60px;
                left: 0;
                right: 0;
                flex-direction: column;
                background: var(--nav-bg);
                padding: 12px 24px 20px;
                gap: 2px;
                border-top: 1px solid var(--nav-border);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
                transition: background 0.5s ease, border-color 0.5s ease;
            }
            .nav-links.open {
                display: flex;
            }
            .nav-links li a {
                padding: 10px 16px;
                font-size: 16px;
                width: 100%;
                text-align: center;
            }
            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .page-header h1 {
                font-size: 24px;
            }
            .blog-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .blog-toolbar .search-box {
                min-width: auto;
            }
            .blog-toolbar .result-count {
                text-align: right;
            }
            .navbar-brand .brand-text {
                font-size: 17px;
            }
            .navbar-brand .logo {
                height: 28px;
            }
            .blog-categories-filter {
                gap: 6px 8px;
            }
            .blog-categories-filter .filter-btn {
                font-size: 11px;
                padding: 3px 12px;
            }
        }
        @media (max-width: 480px) {
            .blog-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .blog-card .body {
                padding: 10px 12px 12px;
            }
            .blog-card .body .title {
                font-size: 14px;
            }
            .blog-card .body .summary {
                font-size: 12px;
                -webkit-line-clamp: 2;
            }
            .blog-card .body .tag {
                font-size: 9px;
                padding: 0 8px;
                border-width: 1px;
            }
            .blog-card .body .date-row {
                font-size: 11px;
            }
            .blog-card .body .author {
                font-size: 11px;
            }
            .search-box input {
                font-size: 13px;
                padding: 6px 12px;
            }
            .search-box button {
                font-size: 13px;
                padding: 6px 12px;
            }
            .container {
                padding: 0 14px;
            }
            .blog-categories-filter .filter-btn {
                font-size: 10px;
                padding: 3px 10px;
            }
        }
        @media (max-width: 380px) {
            .blog-grid {
                gap: 8px;
            }
            .blog-card .body {
                padding: 8px 8px 10px;
            }
            .blog-card .body .title {
                font-size: 12px;
            }
            .blog-card .body .tag {
                font-size: 8px;
                padding: 0 6px;
            }
            .blog-card .body .summary {
                font-size: 11px;
                -webkit-line-clamp: 1;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <header class="navbar" id="navbar">
        <div class="container">
            <div class="navbar-brand">
                <img class="logo" src="https://user-assets.sxlcdn.com/images/1138507/FnXCnd1-XDIsMnQHRLQD_xUKHJac.jpg?imageMogr2/strip/auto-orient/thumbnail/1200x9000%3E/quality/90!/format/png" alt="极光创工作室logo" loading="lazy" onerror="this.style.display='none'">
                <span class="brand-text">极光创工作室</span>
            </div>
            <button class="menu-toggle" id="menuToggle" aria-label="菜单"><i class="fas fa-bars"></i></button>
            <ul class="nav-links" id="navLinks">
                <li><a href="../">主站</a></li>
                <li><a href="../map/">地图库</a></li>
                <li><a href="./" class="active">极创博客</a></li>
                <li><a href="../Management/">管理层成员公示</a></li>
                <li><a href="../Management/member.html">成员档案</a></li>
            </ul>
        </div>
    </header>

    <!-- ===== 博客列表 ===== -->
    <main>
        <div class="container">
            <div class="page-header">
                <h1>极创博客</h1>
                <div class="sub">极光创工作室的创作分享与日志</div>
            </div>

            <!-- 搜索 + 工具栏 -->
            <div class="blog-toolbar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索文章标题、作者..." />
                    <button id="searchBtn"><i class="fas fa-search"></i></button>
                </div>
                <span class="result-count" id="resultCount"></span>
            </div>

            <!-- 分类筛选 -->
            <div class="blog-categories-filter" id="categoriesFilter">
                <button class="filter-btn all-btn active" data-cat="全部">全部</button>
            </div>

            <!-- 博客卡片网格 -->
            <div class="blog-grid" id="blogGrid">
                <div class="loading-placeholder"><i class="fas fa-spinner fa-pulse"></i>加载文章...</div>
            </div>

            <!-- 分页 -->
            <div class="pagination" id="pagination">
                <button id="prevPage" disabled>‹</button>
                <span id="pageInfo" class="info">第 1 / 1 页</span>
                <button id="nextPage" disabled>›</button>
            </div>
        </div>
    </main>

    <!-- ===== 弹窗结构（公共组件） ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-inner" id="modalInner">
                <div id="modalBody"></div>
            </div>
        </div>
    </div>

    <!-- ===== 底部 ===== -->
    <footer class="footer">
        <div class="container">
            <span>极光创工作室</span>
            <span class="sep">·</span>
            <span>Aurora Creation Studio</span>
        </div>
    </footer>

    <!-- 引入公共脚本 -->
    <script src="../assets/js/components.js"></script>

    <script>
        (function() {

            // ===== 移动端菜单 =====
            const toggle = document.getElementById('menuToggle');
            const navLinks = document.getElementById('navLinks');
            if (toggle && navLinks) {
                toggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    navLinks.classList.toggle('open');
                });
                document.addEventListener('click', function(e) {
                    if (!navLinks.contains(e.target) && !toggle.contains(e.target)) {
                        navLinks.classList.remove('open');
                    }
                });
                navLinks.querySelectorAll('a').forEach(function(link) {
                    link.addEventListener('click', function() {
                        navLinks.classList.remove('open');
                    });
                });
            }

            // ============================================================
            // 解析工具
            // ============================================================
            var parseDateFromBody = window.parseDateFromBody || function(body) {
                var patterns = [
                    /(\d{4})[-年](\d{1,2})[-月](\d{1,2})[日]?/,
                    /(\d{4})\/(\d{1,2})\/(\d{1,2})/
                ];
                for (var i = 0; i < patterns.length; i++) {
                    var match = body.match(patterns[i]);
                    if (match) {
                        var year = parseInt(match[1]),
                            month = parseInt(match[2]),
                            day = parseInt(match[3]);
                        if (year >= 2000 && year <= 2100 && month >= 1 && month <= 12 && day >= 1 && day <= 31) {
                            return year + '-' + String(month).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                        }
                    }
                }
                return null;
            };

            // ============================================================
            // ★★★ 解析博客Issue（提取所有分类，摘要去HTML标签） ★★★
            // ============================================================
            function parseBlogIssue(issue) {
                var rawTitle = issue.title && issue.title.trim() !== '' ? issue.title.trim() : '未命名文章';
                var body = issue.body || '';
                var author = '',
                    cover = '';
                var categories = [];

                var lines = body.split('\n');
                var contentStart = 0;

                lines.forEach(function(line, idx) {
                    var trimmed = line.trim();
                    if (trimmed.match(/^作者[：:]\s*(.+)/)) {
                        author = trimmed.replace(/^作者[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^分类[：:]\s*(.+)/)) {
                        var cats = trimmed.replace(/^分类[：:]\s*/, '').trim();
                        categories = cats.split(/[,，、\s]+/).filter(function(c) { return c.trim().length > 0; });
                    } else if (trimmed.match(/^封面[：:]\s*(.+)/)) {
                        cover = trimmed.replace(/^封面[：:]\s*/, '').trim();
                    }
                    if (contentStart === 0 && trimmed && !trimmed.match(/^(作者|分类|封面)[：:]/)) {
                        contentStart = idx;
                    }
                });

                if (!author || author.trim() === '') author = issue.user ? issue.user.login : '未知作者';

                // 封面：手动指定 > 自动提取
                if (!cover) {
                    var fullBody = body;
                    var mdMatch = fullBody.match(/!\[[^\]]*\]\(([^)]+)\)/);
                    if (mdMatch) {
                        cover = mdMatch[1];
                    } else {
                        var htmlMatch = fullBody.match(/<img[^>]+src=["']([^"']+)["']/i);
                        if (htmlMatch) {
                            cover = htmlMatch[1];
                        }
                    }
                }

                // ★ 摘要：先去HTML标签再截取
                var contentLines = lines.slice(contentStart);
                var contentText = contentLines.join(' ');
                contentText = contentText.replace(/<[^>]*>/g, ' ');
                contentText = contentText.replace(/[#*`>\[\]()]/g, ' ');
                contentText = contentText.replace(/\s+/g, ' ').trim();
                var summary = contentText.substring(0, 150) + (contentText.length > 150 ? '...' : '');

                var dateStr = '未知';
                var dateMatch = rawTitle.match(/^(\d{4})-(\d{2})-(\d{2})/);
                if (dateMatch) {
                    var y = parseInt(dateMatch[1]),
                        m = parseInt(dateMatch[2]),
                        d = parseInt(dateMatch[3]);
                    if (y >= 2000 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31) {
                        dateStr = y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                    }
                } else {
                    var bodyDate = parseDateFromBody(body);
                    if (bodyDate) dateStr = bodyDate;
                }

                var title = rawTitle.replace(/^\d{4}-\d{2}-\d{2}-/, '').trim();
                if (!title) title = rawTitle;

                return {
                    id: issue.number,
                    title: title,
                    author: author,
                    categories: categories,
                    category: categories[0] || '未分类',
                    summary: summary || '暂无摘要',
                    date: dateStr,
                    cover: cover,
                    raw: issue
                };
            }

            // ============================================================
            // 解析成员Issue（极光创完整版）
            // ============================================================
            function parseMemberIssue(issue) {
                var title = issue.title && issue.title.trim() !== '' ? issue.title.trim() : '未命名成员';
                var body = issue.body || '';
                var groups = [],
                    minid = '未知',
                    id = '未知',
                    joinDate = '未知',
                    avatar = '',
                    background = '',
                    bio = '',
                    pinnedMap = '',
                    pinnedBlog = '',
                    role = '';
                var workHonors = '',
                    gameHonors = '',
                    liveType = '',
                    liveContent = '';
                var parts = title.split('-');
                var name = parts[0].trim();
                if (parts.length > 1) role = parts.slice(1).join('-').trim();
                var lines = body.split('\n');
                lines.forEach(function(line) {
                    var trimmed = line.trim();
                    if (trimmed.match(/^组别[：:]\s*(.+)/)) {
                        var g = trimmed.replace(/^组别[：:]\s*/, '').trim();
                        groups = g.split(/[,，、\s]+/).filter(function(s) { return s.trim().length > 0; });
                    } else if (trimmed.match(/^迷你号[：:]\s*(.+)/)) {
                        minid = trimmed.replace(/^迷你号[：:]\s*/, '').trim() || '未知';
                    } else if (trimmed.match(/^编号[：:]\s*(.+)/)) {
                        id = trimmed.replace(/^编号[：:]\s*/, '').trim() || '未知';
                    } else if (trimmed.match(/^入室时间[：:]\s*(.+)/)) {
                        var d = trimmed.replace(/^入室时间[：:]\s*/, '').trim();
                        var parsed = parseDateFromBody(d);
                        if (parsed) joinDate = parsed;
                        else joinDate = d || '未知';
                    } else if (trimmed.match(/^头像[：:]\s*(.+)/)) {
                        avatar = trimmed.replace(/^头像[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^背景[：:]\s*(.+)/)) {
                        background = trimmed.replace(/^背景[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^简介[：:]\s*(.+)/)) {
                        bio = trimmed.replace(/^简介[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^置顶地图[：:]\s*(.+)/)) {
                        pinnedMap = trimmed.replace(/^置顶地图[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^置顶博客[：:]\s*(.+)/)) {
                        pinnedBlog = trimmed.replace(/^置顶博客[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^工作室荣誉[：:]\s*(.+)/)) {
                        workHonors = trimmed.replace(/^工作室荣誉[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^游戏荣誉[：:]\s*(.+)/)) {
                        gameHonors = trimmed.replace(/^游戏荣誉[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^灵动岛类型[：:]\s*(.+)/)) {
                        liveType = trimmed.replace(/^灵动岛类型[：:]\s*/, '').trim();
                    } else if (trimmed.match(/^灵动岛内容[：:]\s*(.+)/)) {
                        liveContent = trimmed.replace(/^灵动岛内容[：:]\s*/, '').trim();
                    }
                });
                if (groups.length === 0 && (role === '室长' || role === '副室长')) groups = ['管理层'];
                if (bio) bio = bio.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
                return { name, role, groups, minid, id, joinDate, avatar, background, bio, pinnedMap, pinnedBlog,
                         workHonors, gameHonors, liveType, liveContent };
            }

            // ============================================================
            // 解析地图（用于弹窗）
            // ============================================================
            function parseMapForModal(issue) {
                var title = issue.title && issue.title.trim() !== '' ? issue.title.trim() : '未命名地图';
                var body = issue.body || '';
                var author = '',
                    cover = '',
                    tag = '',
                    dateStr = '未知';
                var lines = body.split('\n');
                lines.forEach(function(line) {
                    var trimmed = line.trim();
                    if (trimmed.match(/^作者[：:]\s*(.+)/)) author = trimmed.replace(/^作者[：:]\s*/, '').trim();
                    if (trimmed.match(/^封面[：:]\s*(.+)/)) cover = trimmed.replace(/^封面[：:]\s*/, '').trim();
                    if (trimmed.match(/^标签[：:]\s*(.+)/)) tag = trimmed.replace(/^标签[：:]\s*/, '').trim();
                });
                var d = parseDateFromBody(body);
                if (d) dateStr = d;
                return { id: issue.number, title: title, author: author || '未知作者', cover: cover, tag: tag || '',
                    date: dateStr };
            }

            // ============================================================
            // ★★★ 分类机制（只显示文章实际存在的标签） ★★★
            // ============================================================
            var THEATER_CATEGORY = '言行大帝';

            // 全局状态
            var allPosts = [];
            var filteredPosts = [];
            var currentPage = 1;
            var pageSize = 16;
            var selectedCategory = '全部';
            var searchKeyword = '';
            var allMembers = [];
            var allMaps = [];
            var allBlogs = [];

            var blogGrid = document.getElementById('blogGrid');
            var searchInput = document.getElementById('searchInput');
            var searchBtn = document.getElementById('searchBtn');
            var categoriesFilter = document.getElementById('categoriesFilter');
            var prevBtn = document.getElementById('prevPage');
            var nextBtn = document.getElementById('nextPage');
            var pageInfo = document.getElementById('pageInfo');
            var resultCount = document.getElementById('resultCount');

            // ============================================================
            // ★★★ 切换暗黑剧场模式 ★★★
            // ============================================================
            function toggleTheaterMode(enable) {
                if (enable) {
                    document.body.classList.add('theater-mode');
                } else {
                    document.body.classList.remove('theater-mode');
                }
            }

            // ============================================================
            // 获取每页数量
            // ============================================================
            function getPerPage() {
                var width = window.innerWidth;
                if (width > 992) return 16;
                else if (width > 768) return 12;
                else return 8;
            }

            // ============================================================
            // ★★★ 渲染分类按钮（从文章实际标签提取 + “言行大帝”条件显示） ★★★
            // ============================================================
            function renderCategories() {
                // 从所有文章中提取分类标签
                var allCatsSet = new Set();
                allPosts.forEach(function(post) {
                    if (post.categories) {
                        post.categories.forEach(function(c) {
                            allCatsSet.add(c);
                        });
                    }
                });
                // 去重、排序
                var allCats = Array.from(allCatsSet).filter(function(c) { return c && c.trim().length > 0; });
                allCats.sort();

                // 构建分类列表：全部 + 所有动态分类
                var catList = ['全部'];
                allCats.forEach(function(c) { catList.push(c); });

                // ★ 检查是否存在“言行大帝”标签，如果有则添加到末尾（并标记为特殊按钮）
                var hasTheater = allCats.indexOf(THEATER_CATEGORY) !== -1;
                if (hasTheater) {
                    var idx = catList.indexOf(THEATER_CATEGORY);
                    if (idx !== -1) {
                        catList.splice(idx, 1);
                    }
                    catList.push(THEATER_CATEGORY);
                }

                var html = '';
                catList.forEach(function(cat) {
                    var active = (selectedCategory === cat) ? ' active' : '';
                    var cls = (cat === '全部') ? 'filter-btn all-btn' : 'filter-btn';
                    if (cat === THEATER_CATEGORY) {
                        cls += ' theater-btn';
                    }
                    html += '<button class="' + cls + active + '" data-cat="' + cat + '">' + cat + '</button>';
                });
                categoriesFilter.innerHTML = html;

                categoriesFilter.querySelectorAll('.filter-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var newCat = this.dataset.cat;
                        if (newCat === selectedCategory) return;

                        // ★ 切换暗黑模式 ★
                        if (newCat === THEATER_CATEGORY) {
                            toggleTheaterMode(true);
                        } else {
                            toggleTheaterMode(false);
                        }

                        selectedCategory = newCat;
                        currentPage = 1;
                        applyFilters();
                    });
                });
            }

            // ============================================================
            // ★★★ 筛选逻辑（“言行大帝”必须包含该标签，且切换暗黑模式） ★★★
            // ============================================================
            function getFilteredPosts() {
                return allPosts.filter(function(post) {
                    var articleCats = post.categories || [];

                    if (selectedCategory === '全部') {
                        // 全部
                    } else if (selectedCategory === THEATER_CATEGORY) {
                        // ★ 修正：必须包含“言行大帝”标签 ★
                        if (articleCats.indexOf(THEATER_CATEGORY) === -1) return false;
                    } else {
                        // 普通分类：文章必须包含该分类
                        if (articleCats.indexOf(selectedCategory) === -1) return false;
                    }

                    if (searchKeyword.trim() !== '') {
                        var keyword = searchKeyword.trim().toLowerCase();
                        var inTitle = post.title.toLowerCase().includes(keyword);
                        var inAuthor = post.author.toLowerCase().includes(keyword);
                        if (!inTitle && !inAuthor) return false;
                    }
                    return true;
                });
            }

            // ============================================================
            // 渲染博客卡片（显示所有分类标签）
            // ============================================================
            function renderBlogCard(post) {
                var authorHtml = '<span class="author" data-author="' + post.author + '"><i class="fas fa-user"></i> ' + post
                    .author + '</span>';

                var tagsHtml = '';
                if (post.categories && post.categories.length > 0) {
                    tagsHtml = '<div class="tags-container">';
                    post.categories.forEach(function(cat) {
                        tagsHtml += '<span class="tag">' + cat + '</span>';
                    });
                    tagsHtml += '</div>';
                }

                var html = '<div class="blog-card" onclick="location.href=\'post.html?id=' + post.id + '\'">';
                html += '<div class="body">';
                html += tagsHtml;
                html += '<span class="title">' + post.title + '</span>';
                html += '<div class="date-row"><i class="fas fa-calendar-alt"></i> ' + post.date + '</div>';
                html += authorHtml;
                html += '<div class="summary">' + post.summary + '</div>';
                html += '<span class="read-more">阅读全文 <i class="fas fa-arrow-right"></i></span>';
                html += '</div></div>';
                return html;
            }

            // ============================================================
            // 分页渲染
            // ============================================================
            function renderPage() {
                pageSize = getPerPage();
                var total = filteredPosts.length;
                var totalPages = Math.ceil(total / pageSize) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                var start = (currentPage - 1) * pageSize;
                var end = Math.min(start + pageSize, total);
                var pageItems = filteredPosts.slice(start, end);

                if (pageItems.length === 0) {
                    blogGrid.innerHTML = '<div class="empty-placeholder">没有匹配的文章</div>';
                } else {
                    var html = '';
                    pageItems.forEach(function(post) { html += renderBlogCard(post); });
                    blogGrid.innerHTML = html;
                }

                pageInfo.textContent = '第 ' + currentPage + ' / ' + totalPages + ' 页';
                prevBtn.disabled = currentPage <= 1;
                nextBtn.disabled = currentPage >= totalPages;

                // 绑定作者点击事件
                blogGrid.querySelectorAll('.author').forEach(function(el) {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var authorName = this.dataset.author;
                        if (typeof window.openMemberModal === 'function') {
                            window.openMemberModal(authorName);
                        } else {
                            alert('公共组件未加载，请检查 assets/js/components.js');
                        }
                    });
                });
            }

            // ============================================================
            // 应用筛选
            // ============================================================
            function applyFilters() {
                searchKeyword = searchInput.value;
                filteredPosts = getFilteredPosts();

                filteredPosts.sort(function(a, b) {
                    if (a.date === '未知' && b.date === '未知') return 0;
                    if (a.date === '未知') return 1;
                    if (b.date === '未知') return -1;
                    return b.date.localeCompare(a.date);
                });

                currentPage = 1;
                renderPage();

                var total = filteredPosts.length;
                if (searchKeyword.trim() || selectedCategory !== '全部') {
                    resultCount.textContent = '找到 ' + total + ' 篇文章';
                } else {
                    resultCount.textContent = '';
                }

                renderCategories();
            }

            // ============================================================
            // 加载数据
            // ============================================================
            function loadData() {
                blogGrid.innerHTML = '<div class="loading-placeholder"><i class="fas fa-spinner fa-pulse"></i>加载文章...</div>';

                var REPO_OWNER = 'jgcgzs',
                    REPO_NAME = 'acns';
                var blogApi = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME +
                    '/issues?labels=blog&state=open&sort=created&direction=desc&per_page=100';
                var memberApi = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME +
                    '/issues?labels=member&state=open&sort=created&direction=desc&per_page=100';
                var mapApi = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME +
                    '/issues?labels=map&state=open&sort=created&direction=desc&per_page=100';

                Promise.all([
                    fetch(blogApi).then(function(r) { return r.ok ? r.json() : []; }),
                    fetch(memberApi).then(function(r) { return r.ok ? r.json() : []; }),
                    fetch(mapApi).then(function(r) { return r.ok ? r.json() : []; })
                ]).then(function(results) {
                    var blogIssues = results[0] || [],
                        memberIssues = results[1] || [],
                        mapIssues = results[2] || [];

                    allPosts = blogIssues.map(function(i) { return parseBlogIssue(i); });

                    if (memberIssues.length) {
                        allMembers = memberIssues.map(function(i) { return parseMemberIssue(i); });
                        allMembers = allMembers.filter(function(m) {
                            if (m.groups && m.groups.length) return true;
                            if (m.role === '室长' || m.role === '副室长') return true;
                            return false;
                        });
                    } else {
                        allMembers = [];
                    }

                    allMaps = mapIssues.map(function(i) { return parseMapForModal(i); });
                    allBlogs = allPosts;

                    window._memberData = allMembers;
                    window._mapData = allMaps;
                    window._blogData = allBlogs;

                    selectedCategory = '全部';
                    toggleTheaterMode(false);
                    renderCategories();
                    applyFilters();
                }).catch(function(err) {
                    console.warn('加载失败:', err);
                    blogGrid.innerHTML =
                        '<div class="blog-error"><i class="fas fa-exclamation-circle"></i>加载失败，请稍后重试<br><span style="font-size:.8rem;opacity:.6;">' +
                        err.message + '</span></div>';
                });
            }

            // ============================================================
            // 事件绑定
            // ============================================================
            searchBtn.addEventListener('click', applyFilters);
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') applyFilters();
            });

            prevBtn.addEventListener('click', function() {
                if (currentPage > 1) { currentPage--;
                    renderPage(); }
            });
            nextBtn.addEventListener('click', function() {
                var total = filteredPosts.length;
                var totalPages = Math.ceil(total / pageSize);
                if (currentPage < totalPages) { currentPage++;
                    renderPage(); }
            });

            var resizeTimer;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    var newPerPage = getPerPage();
                    if (newPerPage !== pageSize) {
                        pageSize = newPerPage;
                        currentPage = 1;
                        renderPage();
                    }
                }, 300);
            });

            // ============================================================
            // 启动
            // ============================================================
            loadData();

        })();
    </script>

</body>
</html>
